{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" -}}
{{- $width := .Get "width" | default "1200" -}}
{{- $height := .Get "height" | default "901" -}}
{{- $webp := replaceRE `\.(jpe?g|JPE?G)$` ".webp" $src -}}
<picture>
  <source srcset="{{ $webp }}" type="image/webp">
  <img src="{{ $src }}" alt="{{ $alt }}" class="img-fluid rounded" width="{{ $width }}" height="{{ $height }}" loading="lazy" decoding="async">
</picture>
